  input_dir: ${oc.env:SMILES23D_DATA}/zarr
  index_dir: ${oc.env:SMILES23D_DATA}/index/eval_index
  predict_split: test_1000
  start_idx: 0
  end_idx: 208304
  batch_size: 64
  shuffle: False
  removeHs: False
  mask_prob: 0.0
  num_workers: 0
  samples_per_molecule: 1

tokenizer:
  _target_: smiles23d.tokenizers.PileTokenizer

test:
