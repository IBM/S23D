  checkpoint: ???
  save_path: outputs/s23d_s_eval2k
  save_mol_file: mols.pkl
  save_rmsd_file: rmsds.pkl
  n_cpus: 32
  diffusion_kwargs:
    kind: VPSDE
    n_steps: 300
  trainer:
    accelerator: gpu
    devices: 1

clearml: null
