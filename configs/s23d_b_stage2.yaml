defaults:
  - nexusnet_config
  - _self_

datamodule:
  _target_: smiles23d.data.geom.GEOMDatamodule
  input_dir: ${oc.env:SMILES23D_DATA}
  batch_size: 64
  shuffle: False
  mask_prob: 0.01
  removeHs: False
  num_workers: 8
  val_dataloader_config: null

tokenizer:
  _target_: smiles23d.tokenizers.PileTokenizer

module:
  _target_: smiles23d.modules.diffusion.DiffusionLM
  diffusion_model:
    _target_: smiles23d.modules.diffusion.CoMVPSDE
    beta_s: 0
    beta_e: 18.0
    center_score: true
    scale: 20.0
  score_network:
    _target_: smiles23d.modules.diffusion.Transformer
    layers: [1,0,13]
    n_embd: 384
    n_head: 12
    n_aux_tokens: 4
    n_time_basis: 10
    translation_augmentation: 30.0
    graph_encoder_kwargs:
      kind: GPS
      random_bits: 0
      use_degree: true
      use_gcn: false
      use_charges: true
      use_bonds: true
    point_encoder_kwargs:
      kind: ScaleAdapt
      n_sin_basis: 6
      xyz: true
      basis_scale: 0.05
      first_layer_only: true
  optimizer:
    lr: 0.0001
    weight_decay: 0.001

task:
  _target_: smiles23d.nexusnet.Task
  checkpoint:
    root_dir: checkpoints
    epoch_dir: epoch_checkpoints
    epoch_filename: "s23d_b_epoch_{epoch}"
    save_datamodule_state: True
    load_datamodule_state: False
    n_steps: 50000
  restart: true
  trainer:
    max_epochs: 130
    gradient_clip_val: 2.0
    use_distributed_sampler: False
